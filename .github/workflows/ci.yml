name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck e build
        run: npm run build

  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    # Informativo: uma vulnerabilidade nova publicada hoje não deve bloquear o merge,
    # mas precisa aparecer no resultado da execução para ser tratada.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
